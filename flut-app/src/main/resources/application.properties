spring.application.name=flut-app
server.port=8081
# Behind the frontend's nginx: build URLs from X-Forwarded-* headers
server.forward-headers-strategy=framework

# Local PostgreSQL 16 (see README); docker-compose overrides these via environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/flut
spring.datasource.username=flut
spring.datasource.password=flut

# JPA / Flyway defaults come from flut-persistence.properties
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

# Uploads (.txt / .json files); JSON bodies are limited by flut.limits.max-body-size
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Input limits (see InputLimits)
flut.limits.max-schuurs-per-scenario=1000
flut.limits.max-boxes-per-schuur=10000
flut.limits.max-body-size=1MB

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.writer-with-order-by-keys=true

springdoc.swagger-ui.csrf.enabled=true

management.endpoints.web.exposure.include=health

# Login with Keycloak (docker compose serves it at keycloak.localhost:8180 for the browser and the app alike)
flut.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak.localhost:8180/realms/flut}
spring.security.oauth2.client.registration.keycloak.client-id=flut-app
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:flut-app-secret}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${flut.keycloak.issuer-uri}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.resourceserver.jwt.issuer-uri=${flut.keycloak.issuer-uri}
