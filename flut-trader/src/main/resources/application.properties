spring.application.name=flut-trader

# Which merchant this trader is, and the secret it signs its files with (the producer knows the same secret)
flut.trader.merchant=${FLUT_MERCHANT:dutch}
flut.trader.secret=${FLUT_MERCHANT_SECRET:dutch-secret}
# Every interval the trader delivers between min-files and max-files files
flut.trader.interval=2m
flut.trader.initial-delay=5s
flut.trader.min-files=1
flut.trader.max-files=5
# Share of deliberately broken files (0 to 1); they end up in the pipeline's failed/ folder
flut.trader.invalid-file-ratio=${FLUT_TRADER_INVALID_FILE_RATIO:0}

flut.trader.sftp.host=${SFTP_HOST:localhost}
flut.trader.sftp.port=${SFTP_PORT:2222}
flut.trader.sftp.username=${FLUT_MERCHANT:dutch}
flut.trader.sftp.password=${SFTP_PASSWORD:dutch}
flut.trader.sftp.directory=data/inbox
