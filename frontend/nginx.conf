# Serves the built UI and proxies every backend path to flut-app, so the browser only ever talks
# to one origin: session and CSRF cookies are first-party and no CORS is needed.
server {
    listen 80;
    root /usr/share/nginx/html;

    client_max_body_size 2m;

    location ~ ^/(api|oauth2|login|logout|swagger-ui|swagger-ui\.html|v3/api-docs)(/|$) {
        proxy_pass ${FLUT_APP_URL};
        # flut-app builds redirect URLs from these (server.forward-headers-strategy=framework).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed file names: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
