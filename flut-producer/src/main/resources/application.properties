spring.application.name=flut-producer

# Base directory: <directory>/<merchant>/data/{inbox,processed,failed} - the SFTP server's home directories.
# In docker-compose it is the volume the SFTP server writes to.
flut.producer.directory=${FLUT_PRODUCER_DIRECTORY:pipeline}
# The merchants files are accepted from, with the secret each signs its files with (<name>.sig)
flut.producer.merchants.dutch.secret=${FLUT_DUTCH_SECRET:dutch-secret}
flut.producer.merchants.french.secret=${FLUT_FRENCH_SECRET:french-secret}
flut.producer.poll-interval=5s
# A file is taken once it has not changed for this long; files named *.part are never taken
flut.producer.settle-time=2s
flut.producer.send-timeout=30s
flut.producer.max-file-size=512KB

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
# A file counts as sent only when every replica has the messages; retries must not duplicate them
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Do not hang for a minute when the broker is down; the file is simply tried again on the next poll
spring.kafka.producer.properties.max.block.ms=10000

# Topic, retention and the pipeline secret (see ScenarioTopicProperties); must match flut-consumer
flut.kafka.topic=flut.scenarios
flut.kafka.pipeline-secret=${FLUT_PIPELINE_SECRET:flut-pipeline-secret}
