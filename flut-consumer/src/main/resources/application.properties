spring.application.name=flut-consumer

# The same database as flut-app (see README); docker-compose overrides these via environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/flut
spring.datasource.username=flut
spring.datasource.password=flut

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=flut-consumer
# A new consumer group starts with the oldest message still in the topic
spring.kafka.consumer.auto-offset-reset=earliest

# Failures that may pass (e.g. database down) are retried, then the message goes to the dead-letter topic
flut.consumer.retries=3
flut.consumer.retry-interval=2s

# Topic, retention and the pipeline secret (see ScenarioTopicProperties); must match flut-producer
flut.kafka.topic=flut.scenarios
flut.kafka.pipeline-secret=${FLUT_PIPELINE_SECRET:flut-pipeline-secret}
